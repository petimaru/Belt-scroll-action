<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boss Aura Compare</title>
    <style>
      :root {
        color: #f7f1df;
        background: #20242b;
        font-family: Trebuchet MS, system-ui, sans-serif;
      }

      body {
        margin: 0;
        padding: 24px;
      }

      main {
        max-width: 1120px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 24px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(280px, 360px) 1fr;
        gap: 18px;
      }

      .panel,
      .stage {
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.22);
      }

      .panel {
        padding: 16px;
      }

      .stage {
        position: relative;
        min-height: 560px;
        overflow: hidden;
        background:
          linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px) 0 0 / 46px 46px,
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px) 0 0 / 46px 46px,
          #2b3038;
      }

      .control {
        margin-bottom: 16px;
      }

      label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
        font-weight: 900;
      }

      input[type="range"] {
        width: 100%;
      }

      .color-actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      button {
        min-height: 42px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 8px;
        color: #f7f1df;
        background: #303741;
        font: inherit;
        font-weight: 900;
        cursor: pointer;
      }

      button.is-selected {
        outline: 2px solid #f7f1df;
      }

      .yellow {
        background: rgba(255, 200, 87, 0.28);
      }

      .red {
        background: rgba(255, 95, 79, 0.28);
      }

      .blue {
        background: rgba(121, 215, 255, 0.28);
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
      }

      .values {
        white-space: pre-wrap;
        margin: 16px 0 0;
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.24);
        color: #f7f1df;
        font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .note {
        margin: 14px 0 0;
        color: #cbd6df;
        font-size: 13px;
        line-height: 1.55;
      }

      @media (max-width: 820px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .stage {
          min-height: 460px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Boss Aura Compare</h1>
      <div class="layout">
        <section class="panel">
          <div class="control">
            <label for="intensity">
              <span>色の濃さ</span>
              <span id="intensityValue"></span>
            </label>
            <input id="intensity" type="range" min="0.4" max="2.4" step="0.05" value="1.45" />
          </div>

          <div class="control">
            <label for="auraWidth">
              <span>横の長さ</span>
              <span id="auraWidthValue"></span>
            </label>
            <input id="auraWidth" type="range" min="70" max="240" step="1" value="150" />
          </div>

          <div class="control">
            <label for="auraHeight">
              <span>縦の長さ</span>
              <span id="auraHeightValue"></span>
            </label>
            <input id="auraHeight" type="range" min="120" max="360" step="1" value="245" />
          </div>

          <div class="control">
            <label>
              <span>オーラの色</span>
              <span id="colorValue">Yellow</span>
            </label>
            <div class="color-actions">
              <button class="yellow is-selected" type="button" data-color="yellow">黄</button>
              <button class="red" type="button" data-color="red">赤</button>
              <button class="blue" type="button" data-color="blue">青</button>
            </div>
          </div>

          <pre id="values" class="values"></pre>
          <p class="note">
            このページはオーラ調整専用です。身長比較は行わず、idle画像に Flame columns 型のオーラを重ねて確認します。
          </p>
        </section>

        <section class="stage">
          <canvas id="preview" width="760" height="560"></canvas>
        </section>
      </div>
    </main>

    <script>
      const imagePath = "assets/sprites/enemy/mid_boss/mid_boss_aura_preview_idle.png";
      const colors = {
        yellow: { label: "Yellow", r: 255, g: 220, b: 86 },
        red: { label: "Red", r: 255, g: 86, b: 62 },
        blue: { label: "Blue", r: 121, g: 215, b: 255 },
      };

      const controls = {
        intensity: document.querySelector("#intensity"),
        width: document.querySelector("#auraWidth"),
        height: document.querySelector("#auraHeight"),
      };
      const output = {
        intensity: document.querySelector("#intensityValue"),
        width: document.querySelector("#auraWidthValue"),
        height: document.querySelector("#auraHeightValue"),
        color: document.querySelector("#colorValue"),
        values: document.querySelector("#values"),
      };
      const canvas = document.querySelector("#preview");
      const context = canvas.getContext("2d");
      const image = new Image();
      let selectedColor = "yellow";

      function auraColor(color, alpha) {
        return `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;
      }

      function drawFlameAura(x, y, width, height, color, intensity) {
        context.save();
        context.globalCompositeOperation = "screen";

        const baseAlpha = Math.min(0.42, 0.16 * intensity);
        const gradient = context.createRadialGradient(x, y - height * 0.35, width * 0.08, x, y - height * 0.36, width * 0.82);
        gradient.addColorStop(0, auraColor(color, baseAlpha));
        gradient.addColorStop(0.5, auraColor(color, baseAlpha * 0.65));
        gradient.addColorStop(1, auraColor(color, 0));
        context.fillStyle = gradient;
        context.beginPath();
        context.ellipse(x, y - height * 0.34, width * 0.7, height * 0.48, 0, 0, Math.PI * 2);
        context.fill();

        const core = context.createLinearGradient(x, y, x, y - height);
        core.addColorStop(0, auraColor(color, Math.min(0.46, 0.24 * intensity)));
        core.addColorStop(0.26, auraColor({ r: 255, g: 255, b: 245 }, Math.min(0.42, 0.22 * intensity)));
        core.addColorStop(0.72, auraColor(color, Math.min(0.22, 0.12 * intensity)));
        core.addColorStop(1, auraColor(color, 0));
        context.fillStyle = core;
        context.beginPath();
        context.moveTo(x - width * 0.18, y);
        context.bezierCurveTo(x - width * 0.34, y - height * 0.24, x - width * 0.1, y - height * 0.48, x - width * 0.04, y - height);
        context.bezierCurveTo(x + width * 0.1, y - height * 0.56, x + width * 0.34, y - height * 0.28, x + width * 0.18, y);
        context.closePath();
        context.fill();

        context.lineCap = "round";
        for (let i = 0; i < 15; i += 1) {
          const t = i / 14;
          const side = t - 0.5;
          const bend = Math.sin(i * 1.9) * width * 0.1;
          const startX = x + side * width * 0.86;
          const endX = x + side * width * (0.18 + Math.abs(side) * 0.35) + bend;
          const endY = y - height * (0.38 + 0.55 * Math.abs(Math.sin(i * 0.73)));
          const alpha = Math.min(0.38, (0.1 + 0.06 * (i % 3)) * intensity);
          context.strokeStyle = auraColor(i % 4 === 0 ? { r: 255, g: 255, b: 245 } : color, alpha);
          context.lineWidth = 3 + (i % 4) * 1.6;
          context.beginPath();
          context.moveTo(startX, y - 4);
          context.bezierCurveTo(startX + bend * 0.8, y - height * 0.25, endX - bend * 0.35, y - height * 0.58, endX, endY);
          context.stroke();
        }

        context.restore();
      }

      function draw() {
        const intensity = Number(controls.intensity.value);
        const auraWidth = Number(controls.width.value);
        const auraHeight = Number(controls.height.value);
        const color = colors[selectedColor];
        output.intensity.textContent = intensity.toFixed(2);
        output.width.textContent = `${auraWidth}px`;
        output.height.textContent = `${auraHeight}px`;
        output.color.textContent = color.label;

        context.clearRect(0, 0, canvas.width, canvas.height);
        context.fillStyle = "#2b3038";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.strokeStyle = "#ffc857";
        context.lineWidth = 2;
        context.beginPath();
        context.moveTo(0, 472);
        context.lineTo(canvas.width, 472);
        context.stroke();

        const spriteHeight = 300;
        const spriteWidth = Math.round(spriteHeight * (image.naturalWidth / image.naturalHeight));
        const x = canvas.width / 2;
        const y = 472;
        drawFlameAura(x, y, auraWidth, auraHeight, color, intensity);
        context.imageSmoothingEnabled = false;
        context.drawImage(image, x - spriteWidth / 2, y - spriteHeight, spriteWidth, spriteHeight);

        output.values.textContent = [
          `BOSS_AURA_STYLE = "flame"`,
          `intensity: ${intensity.toFixed(2)}`,
          `width: ${auraWidth}`,
          `height: ${auraHeight}`,
          `color: ${selectedColor}`,
        ].join("\\n");
      }

      Object.values(controls).forEach((input) => input.addEventListener("input", draw));
      document.querySelectorAll("[data-color]").forEach((button) => {
        button.addEventListener("click", () => {
          selectedColor = button.dataset.color;
          document.querySelectorAll("[data-color]").forEach((item) => item.classList.toggle("is-selected", item === button));
          draw();
        });
      });

      image.onload = draw;
      image.src = imagePath;
    </script>
  </body>
</html>
