<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stage 1 Background Preview</title>
    <style>
      :root {
        color: #f6f0df;
        background: #111411;
        font-family: "Trebuchet MS", "Hiragino Sans", "Yu Gothic", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        padding: 18px;
        background:
          radial-gradient(circle at top left, rgba(255, 200, 87, 0.14), transparent 30rem),
          linear-gradient(145deg, #101713, #1f1918 56%, #0f1215);
      }

      main {
        width: min(100%, 1120px);
        margin: 0 auto;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      h1 {
        margin: 0;
        color: #ffc857;
        font-size: clamp(20px, 3vw, 32px);
      }

      .toolbar p {
        margin: 0;
        color: rgba(246, 240, 223, 0.72);
        font-size: 13px;
      }

      .variant-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }

      .variant-button {
        min-height: 36px;
        padding: 8px 12px;
        border: 1px solid rgba(255, 232, 180, 0.24);
        border-radius: 8px;
        background: rgba(18, 25, 19, 0.88);
        color: #f6f0df;
        font: inherit;
        font-weight: 900;
        cursor: pointer;
      }

      .variant-button.is-selected {
        border-color: rgba(255, 200, 87, 0.72);
        background: rgba(255, 200, 87, 0.18);
      }

      .stage-wrap {
        overflow: hidden;
        border: 1px solid rgba(255, 232, 180, 0.22);
        border-radius: 14px;
        background: rgba(0, 0, 0, 0.42);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
      }

      .stage {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
      }

      .background {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .lane {
        position: absolute;
        left: 4%;
        right: 4%;
        bottom: 9%;
        height: 38%;
        border: 1px solid rgba(121, 215, 255, 0.26);
        border-radius: 18px;
        background: rgba(121, 215, 255, 0.05);
        pointer-events: none;
      }

      .actor {
        position: absolute;
        bottom: 13%;
        height: var(--actor-h);
        transform: translateX(-50%);
        image-rendering: pixelated;
        filter: drop-shadow(0 12px 14px rgba(0, 0, 0, 0.58));
      }

      .petiman {
        left: 34%;
        --actor-h: 18%;
      }

      .rooeeebee {
        left: 46%;
        --actor-h: 21%;
      }

      .slow-puncher {
        left: 63%;
        --actor-h: 26%;
        transform: translateX(-50%) scaleX(-1);
      }

      .knife-thrower {
        left: 76%;
        --actor-h: 26%;
        transform: translateX(-50%) scaleX(-1);
      }

      .caption {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        color: rgba(246, 240, 223, 0.78);
        font-size: 13px;
      }

      @media (max-width: 720px) {
        body {
          padding: 10px;
        }

        .toolbar,
        .caption {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="toolbar">
        <h1>Stage 1 Background Preview</h1>
        <p>32-bit風ドット絵候補。背景はまだ本編未実装。</p>
      </div>

      <div class="variant-actions" aria-label="背景候補切り替え">
        <button class="variant-button is-selected" type="button" data-bg="stage11">Stage 1-1〜1-4</button>
        <button class="variant-button" type="button" data-bg="stage15">Stage 1-5 Boss</button>
      </div>

      <section class="stage-wrap">
        <div class="stage">
          <img id="backgroundImage" class="background" src="assets/maps/stage-1-1/kabukicho-back-alley-bg-32bit.png" alt="Stage 1-1 32-bit background candidate" />
          <div class="lane" aria-hidden="true"></div>
          <img class="actor petiman" src="assets/sprites/player/petiman-idle.png" alt="PETIMAN" />
          <img class="actor rooeeebee" src="assets/sprites/player/rooeeebee-idle.png" alt="ROOEEBEE" />
          <img class="actor slow-puncher" src="assets/sprites/enemy/general/slow_puncher_idle.png" alt="slow puncher" />
          <img class="actor knife-thrower" src="assets/sprites/enemy/general/knife_thrower_idle.png" alt="knife thrower" />
        </div>
        <div class="caption">
          <span id="backgroundLabel">Stage 1-1〜1-4: regular alley background</span>
          <span>Actors: PETIMAN, ROOEEBEE, slow_puncher, knife_thrower</span>
        </div>
      </section>
    </main>
    <script>
      const backgrounds = {
        stage11: {
          src: "assets/maps/stage-1-1/kabukicho-back-alley-bg-32bit.png",
          alt: "Stage 1-1 32-bit background candidate",
          label: "Stage 1-1〜1-4: regular alley background",
        },
        stage15: {
          src: "assets/maps/stage-1-1/kabukicho-back-alley-boss-plaza-32bit.png",
          alt: "Stage 1-5 32-bit boss plaza background candidate",
          label: "Stage 1-5: boss plaza with right-side exit",
        },
      };
      const backgroundImage = document.querySelector("#backgroundImage");
      const backgroundLabel = document.querySelector("#backgroundLabel");
      document.querySelectorAll("[data-bg]").forEach((button) => {
        button.addEventListener("click", () => {
          const background = backgrounds[button.dataset.bg];
          backgroundImage.src = background.src;
          backgroundImage.alt = background.alt;
          backgroundLabel.textContent = background.label;
          document.querySelectorAll("[data-bg]").forEach((otherButton) => {
            otherButton.classList.toggle("is-selected", otherButton === button);
          });
        });
      });
    </script>
  </body>
</html>
