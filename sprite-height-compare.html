<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprite Height Compare</title>
    <style>
      :root {
        color: #f7f1df;
        background: #20242b;
        font-family: Trebuchet MS, system-ui, sans-serif;
      }

      body {
        margin: 0;
        padding: 24px;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 24px;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 14px;
        margin-bottom: 20px;
      }

      .controls-title {
        grid-column: 1 / -1;
        margin: 4px 0 -4px;
        color: #ffc857;
        font-size: 14px;
        font-weight: 900;
      }

      .control {
        padding: 14px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.2);
      }

      label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
        font-weight: 900;
      }

      input[type="range"] {
        width: 100%;
      }

      .stage {
        position: relative;
        overflow-x: auto;
        min-height: 360px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        background:
          linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px) 0 0 / 100% 46px,
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px) 0 0 / 46px 100%,
          #2b3038;
      }

      .aura-stage {
        margin-top: 22px;
        padding: 18px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        background: #252a31;
      }

      .aura-stage h2 {
        margin: 0 0 14px;
        color: #ffc857;
        font-size: 16px;
      }

      .aura-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
      }

      .aura-card {
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.2);
      }

      .aura-card h3 {
        margin: 0 0 10px;
        font-size: 14px;
      }

      .aura-canvas {
        width: 100%;
        max-width: 320px;
        height: auto;
        display: block;
        margin: 0 auto;
        image-rendering: pixelated;
      }

      .ground {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 72px;
        height: 2px;
        background: #ffc857;
      }

      .line-label {
        position: absolute;
        left: 14px;
        bottom: 80px;
        color: #ffc857;
        font-size: 12px;
        font-weight: 900;
      }

      .row {
        position: relative;
        display: flex;
        align-items: flex-end;
        gap: 34px;
        min-width: 1040px;
        height: 330px;
        padding: 0 28px 72px;
        box-sizing: border-box;
      }

      .sprite-card {
        width: 126px;
        text-align: center;
      }

      .sprite-wrap {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        height: 210px;
      }

      canvas {
        image-rendering: pixelated;
      }

      .name {
        margin-top: 8px;
        font-size: 13px;
        font-weight: 900;
      }

      .meta {
        margin-top: 4px;
        color: #cbd6df;
        font-size: 12px;
        line-height: 1.35;
      }

      .note {
        margin-top: 14px;
        color: #cbd6df;
        font-size: 13px;
        line-height: 1.55;
      }

      .values {
        white-space: pre-wrap;
        margin-top: 14px;
        padding: 14px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        color: #f7f1df;
        background: rgba(0, 0, 0, 0.22);
        font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sprite Height Compare</h1>

      <section id="controls" class="controls">
        <div class="controls-title">Normal spriteHeight</div>
        <div class="controls-title">KO koSpriteHeight</div>
      </section>

      <section class="stage">
        <div class="ground"></div>
        <div class="line-label">foot line</div>
        <div id="row" class="row"></div>
      </section>

      <section class="aura-stage">
        <h2>Boss Aura Compare</h2>
        <div class="aura-grid">
          <article class="aura-card">
            <h3>1. Flame columns</h3>
            <canvas id="auraFlame" class="aura-canvas" width="320" height="260"></canvas>
          </article>
          <article class="aura-card">
            <h3>2. Rising rings</h3>
            <canvas id="auraRing" class="aura-canvas" width="320" height="260"></canvas>
          </article>
          <article class="aura-card">
            <h3>3. Veil waves</h3>
            <canvas id="auraVeil" class="aura-canvas" width="320" height="260"></canvas>
          </article>
        </div>
      </section>

      <p class="note">
        各敵の通常画像とKO画像を個別に調整できます。Boss Aura Compare は、上から黄色SMASH、赤CHARGE、青GUARDの見え方を比較します。下の値を `main.js` の `ENEMY_SPRITE_DEFS` に反映します。
      </p>
      <pre id="values" class="values"></pre>
    </main>

    <script>
      const sprites = [
        {
          name: "PETIMAN",
          kind: "player",
          path: "assets/sprites/player/petiman-idle.png",
          height: 92,
        },
        {
          name: "ROOEEBEE",
          kind: "player",
          path: "assets/sprites/player/rooeeebee-idle.png",
          height: 108,
        },
        {
          name: "slow_puncher idle",
          kind: "enemy",
          enemy: "slow_puncher",
          control: "slow_puncher",
          path: "assets/sprites/enemy/general/slow_puncher_idle.png",
          height: 139,
        },
        {
          name: "knife_thrower idle",
          kind: "enemy",
          enemy: "knife_thrower",
          control: "knife_thrower",
          path: "assets/sprites/enemy/general/knife_thrower_idle.png",
          height: 139,
        },
        {
          name: "gunner idle",
          kind: "enemy",
          enemy: "gunner",
          control: "gunner",
          path: "assets/sprites/enemy/general/gunner_idle.png",
          height: 139,
        },
        {
          name: "bike_rusher idle",
          kind: "enemy",
          enemy: "bike_rusher",
          control: "bike_rusher",
          path: "assets/sprites/enemy/general/bike_rusher_idle.png",
          height: 118,
        },
        {
          name: "mid boss idle",
          kind: "enemy",
          enemy: "mid_boss_brawler",
          control: "mid_boss_brawler",
          path: "assets/sprites/enemy/mid_boss/mid_boss_idle.svg",
          height: 142,
        },
        {
          name: "mid boss charge idle",
          kind: "enemy",
          enemy: "mid_boss_charge",
          control: "mid_boss_charge",
          path: "assets/sprites/enemy/mid_boss/mid_boss_charge_idle.png",
          height: 172,
        },
        {
          name: "mid boss charge SMASH",
          kind: "enemy",
          enemy: "mid_boss_charge_smash",
          control: "mid_boss_charge_smash",
          path: "assets/sprites/enemy/mid_boss/mid_boss_charge_attack1.png",
          height: 220,
        },
        {
          name: "mid boss shock idle",
          kind: "enemy",
          enemy: "mid_boss_shock",
          control: "mid_boss_shock",
          path: "assets/sprites/enemy/mid_boss/mid_boss_shock_idle.png",
          height: 172,
        },
        {
          name: "mid boss jump idle",
          kind: "enemy",
          enemy: "mid_boss_jump",
          control: "mid_boss_jump",
          path: "assets/sprites/enemy/mid_boss/mid_boss_jump_idle.png",
          height: 224,
        },
        {
          name: "mid boss jump press",
          kind: "enemy",
          enemy: "mid_boss_jump_press",
          control: "mid_boss_jump_press",
          path: "assets/sprites/enemy/mid_boss/mid_boss_jump_press.png",
          height: 190,
        },
        {
          name: "major boss idle",
          kind: "enemy",
          enemy: "major_boss_brawler",
          control: "major_boss_brawler",
          path: "assets/sprites/enemy/major_boss/major_boss_idle.svg",
          height: 150,
        },
        {
          name: "slow_puncher KO",
          kind: "enemy-ko",
          enemy: "slow_puncher",
          control: "slow_puncher_ko",
          path: "assets/sprites/enemy/general/slow_puncher_ko.png",
          height: 86,
        },
        {
          name: "knife_thrower KO",
          kind: "enemy-ko",
          enemy: "knife_thrower",
          control: "knife_thrower_ko",
          path: "assets/sprites/enemy/general/knife_thrower_ko.png",
          height: 69,
        },
        {
          name: "gunner KO",
          kind: "enemy-ko",
          enemy: "gunner",
          control: "gunner_ko",
          path: "assets/sprites/enemy/general/gunner_ko.png",
          height: 86,
        },
        {
          name: "bike_rusher KO",
          kind: "enemy-ko",
          enemy: "bike_rusher",
          control: "bike_rusher_ko",
          path: "assets/sprites/enemy/general/bike_rusher_ko.png",
          height: 82,
        },
        {
          name: "mid boss KO",
          kind: "enemy-ko",
          enemy: "mid_boss_brawler",
          control: "mid_boss_brawler_ko",
          path: "assets/sprites/enemy/mid_boss/mid_boss_ko.svg",
          height: 88,
        },
        {
          name: "mid boss charge KO",
          kind: "enemy-ko",
          enemy: "mid_boss_charge",
          control: "mid_boss_charge_ko",
          path: "assets/sprites/enemy/mid_boss/mid_boss_charge_ko.png",
          height: 140,
        },
        {
          name: "mid boss shock KO",
          kind: "enemy-ko",
          enemy: "mid_boss_shock",
          control: "mid_boss_shock_ko",
          path: "assets/sprites/enemy/mid_boss/mid_boss_shock_ko.png",
          height: 140,
        },
        {
          name: "mid boss jump KO",
          kind: "enemy-ko",
          enemy: "mid_boss_jump",
          control: "mid_boss_jump_ko",
          path: "assets/sprites/enemy/mid_boss/mid_boss_jump_ko.png",
          height: 182,
        },
        {
          name: "major boss KO",
          kind: "enemy-ko",
          enemy: "major_boss_brawler",
          control: "major_boss_brawler_ko",
          path: "assets/sprites/enemy/major_boss/major_boss_ko.svg",
          height: 96,
        },
      ];

      const row = document.querySelector("#row");
      const controls = document.querySelector("#controls");
      const values = document.querySelector("#values");
      const loadedSprites = [];
      const sliders = {};
      const auraCanvases = [
        { id: "auraFlame", style: "flame" },
        { id: "auraRing", style: "ring" },
        { id: "auraVeil", style: "veil" },
      ];
      const enemySettings = {
        slow_puncher: { spriteHeight: 139, koSpriteHeight: 86 },
        knife_thrower: { spriteHeight: 139, koSpriteHeight: 69 },
        gunner: { spriteHeight: 139, koSpriteHeight: 86 },
        bike_rusher: { spriteHeight: 118, koSpriteHeight: 82 },
        mid_boss_brawler: { spriteHeight: 142, koSpriteHeight: 88 },
        mid_boss_charge: { spriteHeight: 172, koSpriteHeight: 140 },
        mid_boss_charge_smash: { spriteHeight: 220, koSpriteHeight: 140 },
        mid_boss_shock: { spriteHeight: 172, koSpriteHeight: 140 },
        mid_boss_jump: { spriteHeight: 224, koSpriteHeight: 182 },
        mid_boss_jump_press: { spriteHeight: 190, koSpriteHeight: 140 },
        major_boss_brawler: { spriteHeight: 150, koSpriteHeight: 96 },
      };

      function loadImage(path) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = reject;
          image.src = path;
        });
      }

      function getVisibleBounds(image) {
        const canvas = document.createElement("canvas");
        canvas.width = image.naturalWidth;
        canvas.height = image.naturalHeight;
        const context = canvas.getContext("2d", { willReadFrequently: true });
        context.drawImage(image, 0, 0);
        const { data, width, height } = context.getImageData(0, 0, canvas.width, canvas.height);
        let minX = width;
        let minY = height;
        let maxX = -1;
        let maxY = -1;

        for (let y = 0; y < height; y += 1) {
          for (let x = 0; x < width; x += 1) {
            const alpha = data[(y * width + x) * 4 + 3];
            if (alpha <= 8) continue;
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);
          }
        }

        return maxX < 0
          ? { x: 0, y: 0, width: image.naturalWidth, height: image.naturalHeight }
          : { x: minX, y: minY, width: maxX - minX + 1, height: maxY - minY + 1 };
      }

      function getScale(sprite) {
        if (sprite.control) return Number(sliders[sprite.control].input.value) / sprite.height;
        return 1;
      }

      function getDrawHeight(sprite) {
        if (!sprite.control) return sprite.height;
        return Number(sliders[sprite.control].input.value);
      }

      function drawSprite(item) {
        const scale = getScale(item);
        const drawHeight = getDrawHeight(item);
        const source = item.kind === "player"
          ? { x: 0, y: 0, width: item.image.naturalWidth, height: item.image.naturalHeight }
          : item.bounds;
        const drawWidth = Math.round(drawHeight * (source.width / source.height));
        item.canvas.width = Math.max(1, drawWidth);
        item.canvas.height = Math.max(1, drawHeight);
        const context = item.canvas.getContext("2d");
        context.imageSmoothingEnabled = false;
        context.clearRect(0, 0, item.canvas.width, item.canvas.height);
        context.drawImage(
          item.image,
          source.x,
          source.y,
          source.width,
          source.height,
          0,
          0,
          drawWidth,
          drawHeight,
        );
        item.meta.textContent = `${drawWidth} x ${drawHeight}px / scale ${scale.toFixed(2)}`;
      }

      function drawAuraPreview(style, canvas, image, bounds) {
        const context = canvas.getContext("2d");
        context.imageSmoothingEnabled = false;
        context.clearRect(0, 0, canvas.width, canvas.height);
        context.fillStyle = "#20242b";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.strokeStyle = "#ffc857";
        context.lineWidth = 2;
        context.beginPath();
        context.moveTo(0, 218);
        context.lineTo(canvas.width, 218);
        context.stroke();

        const colors = [
          { name: "SMASH", color: { r: 255, g: 200, b: 87 }, x: 72 },
          { name: "CHARGE", color: { r: 255, g: 95, b: 79 }, x: 160 },
          { name: "GUARD", color: { r: 121, g: 215, b: 255 }, x: 248 },
        ];
        colors.forEach((entry, index) => {
          const drawHeight = 128;
          const drawWidth = Math.round(drawHeight * (bounds.width / bounds.height));
          const x = entry.x;
          const y = 218;
          drawPreviewAura(context, style, x, y, 80, 146, entry.color, index);
          context.drawImage(
            image,
            bounds.x,
            bounds.y,
            bounds.width,
            bounds.height,
            x - drawWidth / 2,
            y - drawHeight,
            drawWidth,
            drawHeight,
          );
        });
      }

      function drawPreviewAura(context, style, x, y, width, height, color, seed) {
        context.save();
        context.globalCompositeOperation = "screen";
        if (style === "ring") {
          drawPreviewRingAura(context, x, y, width, height, color, seed);
        } else if (style === "veil") {
          drawPreviewVeilAura(context, x, y, width, height, color, seed);
        } else {
          drawPreviewFlameAura(context, x, y, width, height, color, seed);
        }
        context.restore();
      }

      function previewColor(color, alpha) {
        return `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;
      }

      function drawPreviewFlameAura(context, x, y, width, height, color, seed) {
        const gradient = context.createRadialGradient(x, y - height * 0.42, width * 0.1, x, y - height * 0.42, width * 0.82);
        gradient.addColorStop(0, previewColor(color, 0.2));
        gradient.addColorStop(0.58, previewColor(color, 0.1));
        gradient.addColorStop(1, previewColor(color, 0));
        context.fillStyle = gradient;
        context.beginPath();
        context.ellipse(x, y - height * 0.42, width * 0.74, height * 0.52, 0, 0, Math.PI * 2);
        context.fill();

        context.lineCap = "round";
        for (let i = 0; i < 7; i += 1) {
          const t = i / 6;
          const drift = Math.sin(seed + i * 1.7) * width * 0.1;
          const startX = x + (t - 0.5) * width * 0.72 + drift * 0.4;
          const endY = y - height * (0.5 + 0.28 * Math.abs(Math.sin(seed + i)));
          context.strokeStyle = previewColor(color, 0.24);
          context.lineWidth = 4 + (i % 3) * 2;
          context.beginPath();
          context.moveTo(startX, y - 5);
          context.quadraticCurveTo(startX + drift * 1.6, (y + endY) / 2, startX + drift, endY);
          context.stroke();
        }
      }

      function drawPreviewRingAura(context, x, y, width, height, color, seed) {
        context.lineWidth = 4;
        for (let i = 0; i < 4; i += 1) {
          const rise = ((i + seed * 0.23) % 4) / 4;
          const ringY = y - rise * height;
          const ringW = width * (0.38 + rise * 0.38);
          context.strokeStyle = previewColor(color, 0.24 * (1 - rise) + 0.05);
          context.beginPath();
          context.ellipse(x, ringY, ringW, ringW * 0.2, 0, 0, Math.PI * 2);
          context.stroke();
        }

        const glow = context.createLinearGradient(x, y, x, y - height);
        glow.addColorStop(0, previewColor(color, 0.18));
        glow.addColorStop(0.7, previewColor(color, 0.08));
        glow.addColorStop(1, previewColor(color, 0));
        context.fillStyle = glow;
        context.beginPath();
        context.ellipse(x, y - height * 0.42, width * 0.56, height * 0.52, 0, 0, Math.PI * 2);
        context.fill();
      }

      function drawPreviewVeilAura(context, x, y, width, height, color, seed) {
        const gradient = context.createLinearGradient(x, y, x, y - height);
        gradient.addColorStop(0, previewColor(color, 0.2));
        gradient.addColorStop(0.5, previewColor(color, 0.1));
        gradient.addColorStop(1, previewColor(color, 0));
        context.fillStyle = gradient;
        context.beginPath();
        context.moveTo(x - width * 0.54, y);
        for (let i = 0; i <= 6; i += 1) {
          const t = i / 6;
          const wave = Math.sin(seed + i * 1.3) * width * 0.08;
          context.lineTo(x - width * 0.42 + t * width * 0.84 + wave, y - height * (0.18 + t * 0.74));
        }
        context.lineTo(x + width * 0.54, y);
        context.closePath();
        context.fill();

        context.strokeStyle = previewColor(color, 0.22);
        context.lineWidth = 3;
        context.beginPath();
        context.moveTo(x - width * 0.5, y - height * 0.08);
        context.bezierCurveTo(x - width * 0.64, y - height * 0.5, x - width * 0.18, y - height * 0.7, x - width * 0.3, y - height);
        context.moveTo(x + width * 0.5, y - height * 0.08);
        context.bezierCurveTo(x + width * 0.64, y - height * 0.5, x + width * 0.18, y - height * 0.7, x + width * 0.3, y - height);
        context.stroke();
      }

      function update() {
        Object.values(sliders).forEach(({ input, value }) => {
          value.textContent = `${input.value}px`;
        });
        loadedSprites.forEach(drawSprite);
        values.textContent = Object.entries(enemySettings)
          .map(([enemy, setting]) => {
            const spriteHeight = Number(sliders[enemy].input.value);
            const koSpriteHeight = Number(sliders[`${enemy}_ko`].input.value);
            return `${enemy}: { spriteHeight: ${spriteHeight}, koSpriteHeight: ${koSpriteHeight} }`;
          })
          .join("\n");
      }

      function addSlider(key, label, value, min, max) {
        const control = document.createElement("div");
        control.className = "control";
        const labelElement = document.createElement("label");
        labelElement.htmlFor = key;
        const labelText = document.createElement("span");
        labelText.textContent = label;
        const valueText = document.createElement("span");
        const input = document.createElement("input");
        input.id = key;
        input.type = "range";
        input.min = min;
        input.max = max;
        input.step = 1;
        input.value = value;
        input.addEventListener("input", update);
        labelElement.append(labelText, valueText);
        control.append(labelElement, input);
        controls.append(control);
        sliders[key] = { input, value: valueText };
      }

      function createControls() {
        Object.entries(enemySettings).forEach(([enemy, setting]) => {
          addSlider(enemy, enemy, setting.spriteHeight, 80, 190);
        });
        Object.entries(enemySettings).forEach(([enemy, setting]) => {
          addSlider(`${enemy}_ko`, `${enemy} KO`, setting.koSpriteHeight, 35, 140);
        });
      }

      async function init() {
        createControls();
        let auraImage = null;
        let auraBounds = null;
        for (const sprite of sprites) {
          const image = await loadImage(sprite.path);
          const card = document.createElement("div");
          card.className = "sprite-card";
          const wrap = document.createElement("div");
          wrap.className = "sprite-wrap";
          const canvas = document.createElement("canvas");
          const name = document.createElement("div");
          name.className = "name";
          name.textContent = sprite.name;
          const meta = document.createElement("div");
          meta.className = "meta";
          wrap.append(canvas);
          card.append(wrap, name, meta);
          row.append(card);
          loadedSprites.push({
            ...sprite,
            image,
            canvas,
            meta,
            bounds: getVisibleBounds(image),
          });
          if (sprite.enemy === "mid_boss_charge" && sprite.kind === "enemy") {
            auraImage = image;
            auraBounds = getVisibleBounds(image);
          }
        }
        if (auraImage && auraBounds) {
          auraCanvases.forEach(({ id, style }) => {
            drawAuraPreview(style, document.querySelector(`#${id}`), auraImage, auraBounds);
          });
        }
        update();
      }

      init();
    </script>
  </body>
</html>
