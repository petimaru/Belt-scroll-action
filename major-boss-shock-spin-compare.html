<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Major Boss Shock Spin Compare</title>
    <style>
      :root {
        color: #f7f1df;
        background: #15171c;
        font-family: Trebuchet MS, system-ui, sans-serif;
      }

      body {
        margin: 0;
        padding: 22px;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 24px;
      }

      .layout {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 18px;
      }

      .panel,
      .stage {
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.25);
      }

      .panel {
        padding: 16px;
      }

      .control {
        margin-bottom: 15px;
      }

      label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 7px;
        font-weight: 900;
      }

      input[type="range"] {
        width: 100%;
      }

      .stage {
        min-height: 580px;
        overflow: hidden;
        background:
          linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px) 0 0 / 48px 48px,
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px) 0 0 / 48px 48px,
          #252a32;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
      }

      .values {
        white-space: pre-wrap;
        margin: 16px 0 0;
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.28);
        color: #f7f1df;
        font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .note {
        margin: 14px 0 0;
        color: #cbd6df;
        font-size: 13px;
        line-height: 1.55;
      }

      @media (max-width: 860px) {
        body {
          padding: 12px;
        }

        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Major Boss Shock Spin Compare</h1>
      <div class="layout">
        <section class="panel">
          <div class="control">
            <label for="spriteHeight">
              <span>表示高さ</span>
              <span id="heightValue"></span>
            </label>
            <input id="spriteHeight" type="range" min="160" max="280" step="1" value="205" />
          </div>

          <div class="control">
            <label for="frameMs">
              <span>フレーム間隔</span>
              <span id="frameMsValue"></span>
            </label>
            <input id="frameMs" type="range" min="24" max="140" step="4" value="48" />
          </div>

          <div class="control">
            <label for="spin">
              <span>回転量</span>
              <span id="spinValue"></span>
            </label>
            <input id="spin" type="range" min="0" max="42" step="1" value="22" />
          </div>

          <div class="control">
            <label for="slide">
              <span>横スライド</span>
              <span id="slideValue"></span>
            </label>
            <input id="slide" type="range" min="0" max="58" step="1" value="30" />
          </div>

          <div class="control">
            <label for="squash">
              <span>伸び縮み</span>
              <span id="squashValue"></span>
            </label>
            <input id="squash" type="range" min="0" max="0.22" step="0.005" value="0.095" />
          </div>

          <div class="control">
            <label for="afterimage">
              <span>残像</span>
              <span id="afterimageValue"></span>
            </label>
            <input id="afterimage" type="range" min="0" max="4" step="1" value="2" />
          </div>

          <pre id="values" class="values"></pre>
          <p class="note">
            `major_boss_shock_preview.png` 1枚だけをCanvas変形して、横方向に高速回転しているように見せる実験ページです。ゲーム本体にはまだ組み込んでいません。
          </p>
        </section>

        <section class="stage">
          <canvas id="preview" width="840" height="580"></canvas>
        </section>
      </div>
    </main>

    <script>
      const imagePath = "assets/sprites/enemy/major_boss/major_boss_shock_preview.png";
      const canvas = document.querySelector("#preview");
      const context = canvas.getContext("2d");
      const image = new Image();
      const controls = {
        spriteHeight: document.querySelector("#spriteHeight"),
        frameMs: document.querySelector("#frameMs"),
        spin: document.querySelector("#spin"),
        slide: document.querySelector("#slide"),
        squash: document.querySelector("#squash"),
        afterimage: document.querySelector("#afterimage"),
      };
      const labels = {
        spriteHeight: document.querySelector("#heightValue"),
        frameMs: document.querySelector("#frameMsValue"),
        spin: document.querySelector("#spinValue"),
        slide: document.querySelector("#slideValue"),
        squash: document.querySelector("#squashValue"),
        afterimage: document.querySelector("#afterimageValue"),
      };
      const values = document.querySelector("#values");
      let bounds = null;
      let currentFrame = 0;
      let lastFrameAt = performance.now();

      function readSettings() {
        return {
          spriteHeight: Number(controls.spriteHeight.value),
          frameMs: Number(controls.frameMs.value),
          spin: Number(controls.spin.value),
          slide: Number(controls.slide.value),
          squash: Number(controls.squash.value),
          afterimage: Number(controls.afterimage.value),
        };
      }

      function drawGround() {
        context.fillStyle = "#252a32";
        context.fillRect(0, 0, canvas.width, canvas.height);

        context.fillStyle = "rgba(255, 95, 79, 0.08)";
        context.fillRect(0, 300, canvas.width, 152);

        context.strokeStyle = "rgba(255, 200, 87, 0.72)";
        context.lineWidth = 2;
        context.beginPath();
        context.moveTo(0, 452);
        context.lineTo(canvas.width, 452);
        context.stroke();

        context.save();
        context.globalAlpha = 0.23;
        context.strokeStyle = "#77df74";
        context.lineWidth = 3;
        context.beginPath();
        context.ellipse(420, 450, 170, 46, 0, 0, Math.PI * 2);
        context.stroke();
        context.restore();
      }

      function getPose(frame, settings) {
        const poses = [
          { rotate: -settings.spin, slide: -settings.slide, scaleX: 1 + settings.squash, scaleY: 1 - settings.squash * 0.5, flip: 1 },
          { rotate: -settings.spin * 0.35, slide: -settings.slide * 0.35, scaleX: 1 - settings.squash * 0.5, scaleY: 1 + settings.squash * 0.85, flip: -1 },
          { rotate: settings.spin, slide: settings.slide, scaleX: 1 + settings.squash, scaleY: 1 - settings.squash * 0.5, flip: 1 },
          { rotate: settings.spin * 0.35, slide: settings.slide * 0.35, scaleX: 1 - settings.squash * 0.5, scaleY: 1 + settings.squash * 0.85, flip: -1 },
        ];
        return poses[frame % poses.length];
      }

      function drawSprite(frame, settings, alpha = 1, offsetFrame = 0) {
        const pose = getPose(frame + offsetFrame, settings);
        const drawHeight = settings.spriteHeight;
        const drawWidth = drawHeight * (bounds.width / bounds.height);
        const x = 420 + pose.slide;
        const y = 452;

        context.save();
        context.globalAlpha = 0.26 * alpha;
        context.fillStyle = "#050607";
        context.beginPath();
        context.ellipse(x, y + 16, 110 + Math.abs(pose.slide) * 0.55, 20, 0, 0, Math.PI * 2);
        context.fill();
        context.restore();

        context.save();
        context.globalAlpha = alpha;
        context.translate(x, y);
        context.rotate((pose.rotate * Math.PI) / 180);
        context.scale(pose.flip * pose.scaleX, pose.scaleY);
        context.imageSmoothingEnabled = false;
        context.drawImage(
          image,
          bounds.x,
          bounds.y,
          bounds.width,
          bounds.height,
          -drawWidth / 2,
          -drawHeight,
          drawWidth,
          drawHeight,
        );
        context.restore();
      }

      function draw(now = performance.now()) {
        if (!bounds) return;
        const settings = readSettings();
        if (now - lastFrameAt >= settings.frameMs) {
          currentFrame = (currentFrame + 1) % 4;
          lastFrameAt = now;
        }

        labels.spriteHeight.textContent = `${settings.spriteHeight}px`;
        labels.frameMs.textContent = `${settings.frameMs}ms`;
        labels.spin.textContent = `${settings.spin}deg`;
        labels.slide.textContent = `${settings.slide}px`;
        labels.squash.textContent = settings.squash.toFixed(3);
        labels.afterimage.textContent = `${settings.afterimage}`;
        values.textContent = [
          `majorBossShockSpin: {`,
          `  frameMs: ${settings.frameMs},`,
          `  spin: ${settings.spin},`,
          `  slide: ${settings.slide},`,
          `  squash: ${settings.squash.toFixed(3)},`,
          `  afterimage: ${settings.afterimage},`,
          `}`,
        ].join("\\n");

        drawGround();
        for (let i = settings.afterimage; i > 0; i -= 1) {
          drawSprite(currentFrame, settings, 0.16 * i, -i);
        }
        drawSprite(currentFrame, settings);

        context.fillStyle = "#cbd6df";
        context.font = "900 16px Trebuchet MS, sans-serif";
        context.textAlign = "center";
        context.fillText(`frame ${currentFrame + 1} / 4`, 420, 74);
        requestAnimationFrame(draw);
      }

      Object.values(controls).forEach((control) => control.addEventListener("input", draw));
      image.onload = () => {
        bounds = { x: 0, y: 0, width: image.naturalWidth, height: image.naturalHeight };
        values.textContent = "画像読み込みOK";
        requestAnimationFrame(draw);
      };
      image.onerror = () => {
        values.textContent = `画像を読み込めません: ${imagePath}`;
        drawGround();
        context.fillStyle = "#ff8068";
        context.font = "900 18px Trebuchet MS, sans-serif";
        context.textAlign = "center";
        context.fillText("major_boss_shock.png を読み込めません", 420, 290);
      };
      image.src = imagePath;
    </script>
  </body>
</html>
