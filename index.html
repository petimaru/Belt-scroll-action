<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="data:," />
    <title>ベルトスクロールアクションメーカー Prototype</title>
    <link rel="stylesheet" href="style.css?v=100" />
  </head>
  <body>
    <main class="game-shell" aria-label="ベルトスクロールアクションゲーム">
      <header class="hud hud-top">
        <div class="player-card">
          <span id="playerAvatar" class="avatar" aria-hidden="true"></span>
          <div>
            <div class="player-meta">
              <p id="playerNameLabel" class="label">PETIMAN</p>
              <strong id="lifeText" class="life-text">LIFE 3</strong>
            </div>
            <div class="meter" aria-label="プレイヤーHP">
              <span id="hpBar"></span>
            </div>
          </div>
          <strong id="hpText">HP 100/100</strong>
        </div>
        <button id="specialButton" class="special-card" type="button" aria-label="超必殺技ゲージ">
          <span class="label">Special</span>
          <span class="special-meter">
            <span id="specialBar"></span>
          </span>
          <strong id="specialText">0%</strong>
        </button>
        <div class="score-card">
          <span class="label">Score</span>
          <strong id="scoreText">0</strong>
        </div>
      </header>

      <section class="playfield-wrap">
        <canvas id="gameCanvas" width="960" height="540" aria-label="ゲーム画面"></canvas>
        <div class="touch-help left">左半分ドラッグ: 移動</div>
        <div class="touch-help right">右半分: タップ攻撃 / 下フリック必殺 / 長押し超必殺 / 上スワイプジャンプ</div>
        <div id="message" class="message" aria-live="polite"></div>
        <div id="titleOverlay" class="title-overlay" aria-live="polite">
          <div class="title-panel">
            <p class="title-kicker">Belt Scroll Action</p>
            <h1>STREET BREAKER</h1>
            <p id="titleNotice" class="title-notice"></p>
            <div id="titleSetupPanel">
              <div id="characterActions" class="character-actions" aria-label="キャラクター選択"></div>
              <div class="difficulty-actions" aria-label="難易度選択">
                <button class="difficulty-button" type="button" data-difficulty="easy">
                  <span>Easy</span>
                  <small>練習向け</small>
                </button>
                <button class="difficulty-button is-selected" type="button" data-difficulty="normal">
                  <span>Normal</span>
                  <small>標準</small>
                </button>
                <button class="difficulty-button" type="button" data-difficulty="hard">
                  <span>Hard</span>
                  <small>手強い</small>
                </button>
              </div>
              <div class="title-nav-actions">
                <button id="stageSelectButton" class="start-button primary" type="button">ステージ選択へ</button>
              </div>
            </div>
            <div id="stageSelectPanel" class="stage-select-panel" hidden>
              <div class="stage-select-header">
                <strong>Stage Select</strong>
                <small>ステージ6はステージ1〜5クリア後に解放</small>
              </div>
              <div id="debugStartActions" class="debug-start-actions" aria-label="ステージ選択"></div>
              <div class="title-nav-actions">
                <button id="titleBackButton" class="start-button" type="button">戻る</button>
              </div>
            </div>
          </div>
        </div>
        <div id="continueOverlay" class="continue-overlay" aria-live="assertive" hidden>
          <div class="continue-count" id="continueCount">10</div>
          <div class="continue-title">CONTINUE?</div>
          <div class="continue-actions">
            <button id="continueButton" type="button">Continue</button>
            <button id="giveUpButton" type="button">Give Up</button>
          </div>
        </div>
      </section>

      <footer class="hud hud-bottom">
        <p>PC操作: WASD / 矢印キーで移動、Space / クリックで攻撃、Qで必殺、Rで超必殺、Shift+左右でジャンプ</p>
        <p>Prototype: 5エリアで1ステージ、ステージ選択から開始</p>
      </footer>
    </main>

    <script src="main.js?v=100"></script>
  </body>
</html>
